[env:esp32-2432S028R]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.partitions = partitions.csv
; This project has an explicit two-slot OTA table. PlatformIO otherwise uses
; its generic ESP32 default (0x10000), which is not app0 here and can leave a
; perfectly flashed binary invisible to the bootloader.
board_upload.offset_address = 0xC0000
framework = arduino
monitor_speed = 115200
; 115200 is slower, but avoids the CH340 transfer stalls observed on the
; physical CYD board during recovery flashes. Reliability matters more than
; a short USB benchmark because this path must preserve the player's save.
upload_speed = 115200
build_src_filter = +<*> -<recovery_main.cpp>
; PIOArduino uses this unflag as the supported switch for HybridCompile LTO:
; it removes the framework's linker-only -fno-lto and enables the matching
; GCC plugin for every Arduino/ESP-IDF component.
build_unflags =
  -fno-lto
lib_deps =
  https://github.com/Bodmer/TFT_eSPI/archive/refs/tags/V2.5.43.zip
  https://github.com/h2zero/NimBLE-Arduino/archive/refs/tags/2.5.0.zip
  https://github.com/knolleary/pubsubclient/archive/refs/tags/v2.8.zip

build_flags =
    ; Both the native scanner and Arduino station pass through this project
    ; wrapper, which clamps generic high-throughput Wi-Fi reservations to the
    ; small PGCH relay workload without replacing a framework package.
    -Wl,--wrap=esp_wifi_init
    ; Merge identical flash constants across translation units; this keeps the
    ; fixed OTA image compact after the exact expansion animation tables are
    ; linked in.
    -fmerge-all-constants
    ; The firmware has no exception/unwind consumer. Keeping compiler unwind
    ; tables would waste flash and can push a valid OTA image over the fixed
    ; app0/app1 slot boundary.
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -fno-exceptions
    ; Whole-program optimization removes duplicate template/helper bodies
    ; across the large Gen-I--VII battle and campaign translation units. The
    ; fixed OTA partition cannot grow without breaking installed devices.
    -flto
    ; Keep production on the same size-first code-generation mode exercised by
    ; the physical animation profile. The raw ESP image (not only the ELF
    ; estimate) must fit either fixed 0x1E0000-byte OTA slot.
    -Oz
    ; Emit per-function stack reports during local builds. This has no runtime
    ; cost and keeps the no-PSRAM animation path auditable on real hardware.
    -fstack-usage
  ; Pokegochi is strictly peer-to-peer: one peer, two characteristics and no
  ; bonded-device list. The NimBLE defaults reserve three links/eight CCCDs
  ; and more packet buffers than this RAM-constrained graphics device needs.
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_MAX_BONDS=1
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=2
  -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=12
  -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517
    -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=3072
  -D POKEGOCHI_RECOVERY_LAYOUT=1
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  ; CYD ESP32-2432S028R uses the ILI9341 BGR memory-access order.
  -D TFT_RGB_ORDER=0
  ; This panel variant needs the ILI9341 inversion bit enabled for normal
  ; black/white and colour polarity.
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT=1
  ; Wi-Fi bursts on the CYD share a noisy board-level power/signal path with
  ; the ILI9341. Real GRAM readback showed changing corrupt columns at 20 MHz
  ; even though the retained scene hash was valid. Use the controller's wide
  ; signal-margin profile; a full 320x240 PvP repaint is still well below one
  ; second and visual integrity is more important than peak bus throughput.
  -D SPI_FREQUENCY=10000000
  -D SPI_READ_FREQUENCY=8000000

; Tiny factory image used only to install or restore the large game image
; staged on microSD.  It intentionally excludes every game translation unit,
; BLE and Wi-Fi so it remains independently bootable inside 0xB0000 bytes.
[env:recovery]
extends = env:esp32-2432S028R
board_upload.offset_address = 0x10000
build_src_filter = -<*> +<recovery_main.cpp>
lib_deps =
build_flags =
  -fmerge-all-constants
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables
  -fno-exceptions
  -flto
  -Oz
  -D POKEGOCHI_RECOVERY_IMAGE=1
  -D USER_SETUP_LOADED=1

; Cable-only fixture used to measure real battle-animation cadence without
; requiring touch input. Production keeps the parser out of its constrained
; OTA image; this environment adds only ANIMSETUP/ANIMSPEED/ANIMPLAY.
[env:animation-profile]
extends = env:esp32-2432S028R
build_flags =
  ${env:esp32-2432S028R.build_flags}
  ; The cable fixture includes the serial animation controls on top of the
  ; complete production engine but must still fit the same fixed OTA slot.
  -D POKEGOCHI_ANIMATION_DIAGNOSTICS=1

; Cable-only fixture for the complete opt-in Wild auto-battle lifecycle. It
; stages three one-hit encounters, including both chain transitions and the
; final save/Home rebuild, while exposing inactivity/display state over USB.
[env:wild-auto-profile]
extends = env:esp32-2432S028R
build_flags =
  ${env:esp32-2432S028R.build_flags}
  -D POKEGOCHI_WILD_AUTO_DIAGNOSTICS=1

; Small idempotent cable-only service image used by R20261104-331 to place a
; shiny level-100 Greninja in an existing save. The production environment
; excludes the command completely; after the save is verified this image is
; replaced by the ordinary esp32-2432S028R firmware.
[env:greninja-box-fixture]
extends = env:esp32-2432S028R
build_flags =
  ${env:esp32-2432S028R.build_flags}
  -D POKEGOCHI_GRENINJA_BOX_FIXTURE=1

; Cable-only, idempotent service image used to place three normal Spinda with
; deliberately distinct personalities in an existing Box. Production omits
; both the command and its constants; the ordinary firmware is restored as
; soon as the save commit has been verified over USB.
[env:spinda-box-fixture]
extends = env:esp32-2432S028R
build_flags =
  ${env:esp32-2432S028R.build_flags}
  -D POKEGOCHI_SPINDA_BOX_FIXTURE=1

; One-shot, read-only SD-card frequency sweep used during hardware bring-up.
; It inherits the production pinout and is never the default upload target.
[env:sd-stress]
extends = env:esp32-2432S028R
upload_speed = 115200
build_flags =
  ${env:esp32-2432S028R.build_flags}
  -D SD_STRESS_TEST=1

; One-shot service image for a card whose FAT was already lost (for example,
; power removed during an asset update). It never runs in production builds.
[env:sd-format-recovery]
extends = env:esp32-2432S028R
upload_speed = 115200
build_flags =
  ${env:esp32-2432S028R.build_flags}
  -D POKEGOCHI_SD_FORMAT_RECOVERY=1
